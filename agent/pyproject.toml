[project]
name = "cameradvr-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "cryptography>=42", "pynput>=1.7", "psutil>=5.9", "pystray>=0.19", "Pillow>=10", "pywebview>=5"]

[project.scripts]
cameradvr-agent = "cameradvr_agent.main:main"

[tool.setuptools.package-data]
cameradvr_agent = ["license_public.pem", "ui/*.html"]
